name: Build Winlator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Скачать исходники Winlator
        run: git clone --depth 1 https://github.com/brunodev85/winlator-app.git base

      - name: NDK и CMake
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Собрать APK
        working-directory: base
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: winlator-apk
          path: base/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: winlator-${{ github.run_number }}
          name: Winlator base ${{ github.run_number }}
          files: base/app/build/outputs/apk/debug/app-debug.apk

name: Build App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Скачать движок Winlator
        run: git clone --depth 1 https://github.com/brunodev85/winlator-app.git base

      - name: Вложить движок в проект
        run: |
          rm -rf app/src/main/java/com app/src/main/res app/src/main/jniLibs app/src/main/assets app/src/main/cpp
          cp -r base/app/src/main/java/com app/src/main/java/com
          cp -r base/app/src/main/res app/src/main/res
          cp -r base/app/src/main/jniLibs app/src/main/jniLibs
          cp -r base/app/src/main/assets app/src/main/assets
          cp -r base/app/src/main/cpp app/src/main/cpp
          cp base/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp base/app/proguard-rules.pro app/proguard-rules.pro
          python3 patch_manifest.py

      - name: NDK и CMake
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk

name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать наш код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Скачать движок Winlator
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git engine
          echo "коммит движка:"
          git -C engine rev-parse HEAD
          echo "содержимое движка:"
          ls -la engine/app/src/main

      - name: Влить движок в приложение
        run: |
          set -e
          SRC=engine/app/src/main
          DST=app/src/main

          test -f "$SRC/cpp/CMakeLists.txt" || { echo "ОШИБКА: в движке нет cpp/CMakeLists.txt"; exit 1; }

          rm -rf "$DST/cpp"
          cp -r "$SRC/cpp" "$DST/cpp"

          rm -rf "$DST/java/com"
          cp -r "$SRC/java/com" "$DST/java/com"

          rm -rf "$DST/jniLibs"
          cp -r "$SRC/jniLibs" "$DST/jniLibs"

          rm -rf "$DST/assets"
          cp -r "$SRC/assets" "$DST/assets"

          rm -rf "$DST/res"
          cp -r "$SRC/res" "$DST/res"

          cp "$SRC/AndroidManifest.xml" "$DST/AndroidManifest.xml"
          if [ -f engine/app/proguard-rules.pro ]; then cp engine/app/proguard-rules.pro app/proguard-rules.pro; fi

          echo "--- проверка результата ---"
          ls -la "$DST"
          ls "$DST/cpp"
          ls "$DST/java/com/winlator" | head -5
          ls "$DST/jniLibs/arm64-v8a" | head -5

      - name: Подправить манифест
        run: |
          test -f patch_manifest.py || { echo "ОШИБКА: нет файла patch_manifest.py в репозитории"; exit 1; }
          python3 patch_manifest.py

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Выложить APK в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

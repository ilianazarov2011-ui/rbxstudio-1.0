# Параметры сборки

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

# ВАЖНО: без этих двух строк Java-код движка Winlator не компилируется.
# В AGP 8 по умолчанию R-класс не final и без ресурсов из библиотек,
# а Winlator использует R.id внутри switch и R.attr.colorAccent / colorError.
android.nonFinalResIds=false
android.nonTransitiveRClass=false
